<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Funcionários - Sistema</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<header>
    <h1>Funcionários</h1>
    <nav>
        <a href="/">Home</a> |
        <a href="/ferramentas">Ferramentas</a> |
        <a href="/emprestimos">Empréstimos</a>
    </nav>
</header>
<main>
    <section>
        <h2>Lista de Funcionários</h2>
        <div id="funcionarios-list">Carregando...</div>
        <h3>Cadastrar Funcionário</h3>
        <form id="funcionario-form">
            <input type="text" id="funcionario-nome" placeholder="Nome" required />
            <input type="text" id="funcionario-matricula" placeholder="Matrícula" required />
            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
