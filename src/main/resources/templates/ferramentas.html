<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ferramentas - Sistema</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<header>
    <h1>Ferramentas</h1>
    <nav>
        <a href="/">Home</a> |
        <a href="/funcionarios">Funcionários</a> |
        <a href="/emprestimos">Empréstimos</a>
    </nav>
</header>
<main>
    <section>
        <h2>Lista de Ferramentas</h2>
        <div id="ferramentas-list">Carregando...</div>
        <h3>Cadastrar Ferramenta</h3>
        <form id="ferramenta-form">
            <input type="text" id="ferramenta-nome" placeholder="Nome" required />
            <input type="text" id="ferramenta-descricao" placeholder="Descrição" />
            <button type="submit">Cadastrar</button>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
