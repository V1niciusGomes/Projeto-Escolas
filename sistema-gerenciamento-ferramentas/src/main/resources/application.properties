# Spring datasource (MySQL) - edit username/password as needed
spring.datasource.url=jdbc:mysql://localhost:3306/projeto_escolas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Use improved dialect detection but you can force it if needed
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Jackson JavaTime module auto-configuration should register module, but ensure serialization of dates
spring.jackson.serialization.write-dates-as-timestamps=false

# Server port (optional)
server.port=8080
